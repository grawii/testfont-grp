<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Tester - GRP House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-mitr min-h-screen pb-20">

<main class="max-w-6xl mx-auto px-4 pt-12 relative z-10">
    <div class="text-center mb-12">
        <h1 class="font-eng text-4xl md:text-5xl font-black text-[#8c5a65] drop-shadow-sm mb-3">FONT TESTER</h1>
        <span class="inline-block bg-[#ffccd5] text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest uppercase">Pinkjulieland Edition</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
        
        <div class="md:col-span-5 space-y-6">
            <div class="soft-window">
                <div class="window-header">
                    <div class="flex gap-1.5 mr-auto">
                        <div class="dot dot-1"></div>
                        <div class="dot dot-2"></div>
                        <div class="dot dot-3"></div>
                    </div>
                    <span class="font-eng font-bold text-[#e07a8f] text-[10px] tracking-widest uppercase">SETTING_UP</span>
                </div>
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-[#8c5a65] mb-2 flex items-center gap-2">
                            <span class="text-[#ff9eaa]">✦</span> เลือกฟอนต์
                        </label>
                        <select id="fontSelect" class="w-full p-3 rounded-xl border-2 border-[#fff0f3] bg-[#fffafb] text-[#8c5a65] outline-none transition-all focus:border-[#ff9eaa]"></select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[#8c5a65] mb-2 flex justify-between">
                            <span>ขนาดฟอนต์</span>
                            <span id="sizeValue" class="text-[#ff9eaa]">48px</span>
                        </label>
                        <input type="range" id="fontSize" min="20" max="150" value="48" class="w-full h-1.5 bg-[#fff0f3] rounded-full appearance-none cursor-pointer accent-[#ff9eaa]">
                    </div>

                    <div id="weightControl" class="hidden border-t border-dashed border-pink-100 pt-4">
                        <label class="block text-sm font-bold text-[#8c5a65] mb-3">น้ำหนักฟอนต์</label>
                        <div id="weightButtons" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div id="styleControl" class="hidden border-t border-dashed border-pink-100 pt-4">
                        <label class="block text-sm font-bold text-[#8c5a65] mb-3">ลักษณะฟอนต์</label>
                        <div id="styleButtons" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <button onclick="window.open('https://m.me/yourpage')" class="contact-btn w-full">
                🛒 ADD TO CART (<span id="priceLabel">0.-</span>)
            </button>
        </div>

        <div class="md:col-span-7">
            <div class="soft-window h-full flex flex-col shadow-lg">
                <div class="window-header">
                    <div class="flex gap-1.5 mr-auto">
                        <div class="dot dot-1"></div>
                        <div class="dot dot-2"></div>
                        <div class="dot dot-3"></div>
                    </div>
                    <span class="font-eng font-bold text-[#ff8fa3] text-[10px] tracking-widest uppercase">LIVE_PREVIEW</span>
                </div>
                
                <div class="p-6 flex-1 flex flex-col min-h-[400px]">
                    <textarea id="textInput" class="w-full p-4 bg-[#fffafb] border-2 border-dashed border-[#ffdce3] rounded-2xl text-[#8c5a65] text-center mb-6 focus:outline-none focus:bg-white transition-colors" placeholder="พิมพ์ข้อความตรงนี้น้า..." rows="2"></textarea>
                    
                    <div class="preview-display flex-1 flex items-center justify-center p-4 bg-white rounded-2xl border border-pink-50 overflow-hidden">
                        <p id="displayText" class="text-center break-words w-full leading-tight transition-all">ลองพิมพ์ข้อความน้าา ♡</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
