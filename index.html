<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Tester - GRP House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-mitr min-h-screen pb-20">

<main class="max-w-6xl mx-auto px-4 pt-12 relative z-10">
    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-black text-[#8c5a65] drop-shadow-sm mb-3">FONT TESTER</h1>
        <span class="inline-block bg-[#ffccd5] text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest uppercase">GRP House</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
        <div class="md:col-span-5 space-y-6">
            <div class="soft-window">
                <div class="window-header">
                    <div class="flex gap-1.5 mr-auto">
                        <div class="dot dot-1"></div>
                        <div class="dot dot-2"></div>
                        <div class="dot dot-3"></div>
                    </div>
                    <span class="font-bold text-[#e07a8f] text-[10px] tracking-widest uppercase">SETTING_UP</span>
                </div>
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-[#8c5a65] mb-2">✦ เลือกฟอนต์</label>
                        <select id="fontSelect" class="w-full p-3 rounded-xl border-2 border-[#fff0f3] bg-[#fffafb] text-[#8c5a65] outline-none transition-all focus:border-[#ff9eaa]"></select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[#8c5a65] mb-2 flex justify-between">
                            <span>ขนาดฟอนต์</span>
                            <span id="sizeValue" class="text-[#ff9eaa]">69px</span>
                        </label>
                        <input type="range" id="fontSize" min="20" max="150" value="48" class="w-full h-1.5 bg-[#fff0f3] rounded-full appearance-none cursor-pointer accent-[#ff9eaa]">
                    </div>

                    <div id="weightControl" class="hidden border-t border-dashed border-pink-100 pt-4">
                        <label class="block text-sm font-bold text-[#8c5a65] mb-3">น้ำหนักฟอนต์</label>
                        <div id="weightButtons" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div id="styleControl" class="hidden border-t border-dashed border-pink-100 pt-4">
                        <label class="block text-sm font-bold text-[#8c5a65] mb-3">ลักษณะฟอนต์</label>
                        <div id="styleButtons" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <button onclick="addToCart()" class="contact-btn w-full">
             🛒 ADD TO CART (<span id="priceLabel">0.-</span>)
            </button>
        </div>

        <div class="md:col-span-7">
            <div class="soft-window h-full flex flex-col shadow-lg">
                <div class="window-header">
                    <div class="flex gap-1.5 mr-auto">
                        <div class="dot dot-1"></div>
                        <div class="dot dot-2"></div>
                        <div class="dot dot-3"></div>
                    </div>
                    <span class="font-bold text-[#ff8fa3] text-[10px] tracking-widest uppercase">LIVE_PREVIEW</span>
                </div>
                
                <div class="p-6 flex-1 flex flex-col min-h-[400px]">
                    <textarea id="textInput" class="w-full p-4 bg-[#fffafb] border-2 border-dashed border-[#ffdce3] rounded-2xl text-[#8c5a65] text-center mb-6 focus:outline-none focus:bg-white transition-colors" placeholder="พิมพ์ข้อความตรงนี้น้า..." rows="2"></textarea>
                    
                    <div class="preview-display flex-1 flex items-center justify-center p-4 bg-white rounded-2xl border border-pink-50 overflow-hidden">
                        <p id="displayText" class="text-center break-words w-full leading-tight transition-all">ลองพิมพ์ข้อความน้าา ♡</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cartIcon" onclick="openCart()" class="fixed top-6 right-6 z-50 cursor-pointer">
        <div class="relative bg-white p-3 rounded-2xl shadow-lg border-2 border-[#ffdce3]">
            <svg class="w-7 h-7 text-[#8c5a65]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span id="cartCount" class="absolute -top-2 -right-2 bg-[#ff9eaa] text-white text-[10px] font-black w-6 h-6 flex items-center justify-center rounded-full">0</span>
        </div>
    </div>

    <div id="cartModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm">
        <div class="soft-window w-full max-w-sm shadow-2xl animate-pop">
            <div class="window-header">
                <div class="flex gap-1.5 mr-auto">
                    <div class="dot dot-1 cursor-pointer" onclick="closeCart()"></div>
                    <div class="dot dot-2"></div>
                    <div class="dot dot-3"></div>
                </div>
                <span class="font-bold text-[#8c5a65] text-[10px]">MY_CART</span>
            </div>
            <div class="p-6">
                <div id="cartItems" class="space-y-1 max-h-48 overflow-y-auto mb-4"></div>
                <div class="border-t-2 border-dashed border-pink-100 pt-4 mb-6 flex justify-between font-black text-[#8c5a65]">
                    <span>ยอดรวมทั้งสิ้น</span>
                    <span id="totalPrice">0.-</span>
                </div>
                <button onclick="goToCheckout()" class="contact-btn w-full text-xs py-3">แจ้งรายละเอียดการรับไฟล์</button>
            </div>
        </div>
    </div>

    <div id="checkoutPage" class="fixed inset-0 z-[70] hidden bg-[#fffcfd] overflow-y-auto p-4 flex items-center justify-center">
        <div class="w-full max-w-md soft-window shadow-xl relative bg-white">
            <div class="p-8 space-y-6 text-center">
                <div class="space-y-1">
                    <h2 class="text-xl font-black text-[#8c5a65]">RECEIPT</h2>
                    <p class="text-[10px] text-pink-300 uppercase tracking-widest">GRP House Official Store</p>
                </div>

                <div id="receiptList" class="text-left space-y-2 border-y-2 border-dashed border-pink-100 py-6 font-medium text-[#8c5a65]"></div>
                
                <div class="space-y-2 text-left">
                    <label class="text-[10px] font-black text-[#ff9eaa] uppercase">Email for delivery</label>
                    <input type="email" id="userEmail" class="w-full p-4 rounded-2xl border-2 border-pink-50 bg-[#fffafb] text-[#8c5a65] text-sm outline-none focus:border-[#ff9eaa]" placeholder="example@gmail.com">
                </div>

                <div class="space-y-3">
                    <button onclick="copyAndLine()" class="contact-btn w-full py-4 text-sm font-black shadow-lg">COPY & OPEN LINE</button>
                    <button onclick="closeCheckout()" class="text-[10px] text-[#8c5a65] underline opacity-40 uppercase font-bold">Back to edit</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
